name: HYRAM Public Homepage Verification
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'faq.html'
      - 'policies.html'
      - 'catalog.html'
      - 'chat-widget.js'
      - 'chat-knowledge.json'
      - 'pricing/**'
      - 'expert-home.css'
      - 'hyram-mark.svg'
      - 'auth/**'
      - 'admin/**'
      - 'login.html'
      - '.github/workflows/public-home-verify.yml'
      - 'lesson.html'
      - 'lesson.css'
      - 'images/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Verify HTTPS, new homepage and customer navigation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            html="$(mktemp)"
            status="$(curl -L --silent --show-error --max-time 25 --output "$html" --write-out '%{http_code} %{url_effective} %{ssl_verify_result}' https://hyramgolf.kr/ || true)"
            echo "Attempt $attempt: $status"
            if [[ "$status" == 200* ]] && grep -q 'id="expert-hero-title"' "$html" && grep -q '클럽보다 먼저,' "$html" && grep -q 'id="master-fitter"' "$html" && grep -q 'href="signup.html"' "$html"; then
              echo "PASS: official homepage serves the new expert design"
              rm -f "$html"
              break
            fi
            rm -f "$html"
            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::Official domain has not published expert homepage within 3 minutes"
              exit 1
            fi
            sleep 15
          done
          for path in /expert-home.css /hyram-mark.svg /signup.html /login.html /catalog.html /lesson.html /lesson.css /images/park-hyeonggyu-portrait.webp /images/sg-golf-reception.webp /images/sg-golf-lounge.webp /images/sg-golf-practice-bays.webp /auth/client.mjs /auth/callback.html /admin/; do
            for attempt in $(seq 1 12); do
              result="$(curl -L --silent --show-error --max-time 25 --output /dev/null --write-out '%{http_code} %{ssl_verify_result}' "https://hyramgolf.kr$path" || true)"
              if [[ "$result" == "200 0" ]]; then
                echo "$path: 200 0"
                break
              fi
              if [[ "$attempt" -eq 12 ]]; then
                echo "::error::$path not live after 12 attempts: $result"
                exit 1
              fi
              sleep 10
            done
          done
          cssfile="$(mktemp)"
          curl -L --fail --silent --show-error --max-time 25 https://hyramgolf.kr/expert-home.css -o "$cssfile"
          grep -q 'Compact, image-first mobile' "$cssfile"
          rm -f "$cssfile"
          for attempt in $(seq 1 12); do
            configfile="$(mktemp)"
            config_status="$(curl -L --silent --show-error --max-time 25 --output "$configfile" --write-out '%{http_code} %{ssl_verify_result}' https://hyramgolf.kr/auth/site-config.mjs || true)"
            if [[ "$config_status" == "200 0" ]] && grep -q 'https://ekjbssnlurwriomgqlgw.supabase.co' "$configfile" && grep -q "export const publishableKey = 'sb_publishable_" "$configfile"; then
              echo 'PASS: deployed browser auth project configuration verified (no keys logged)'
              rm -f "$configfile"
              break
            fi
            rm -f "$configfile"
            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::Official site auth project configuration did not deploy within 3 minutes"
              exit 1
            fi
            sleep 15
          done
          lessonfile="$(mktemp)"
          curl -L --fail --silent --show-error --max-time 25 https://hyramgolf.kr/lesson.html -o "$lessonfile"
          grep -q '박형규' "$lessonfile"
          grep -q '명지국제8로10번길 38' "$lessonfile"
          grep -q '선발전 순위' "$lessonfile"
          rm -f "$lessonfile"
          echo 'PASS: verified published pro lesson identity, address, and accurate ranking disclosure'
          printf 'Official host and navigational assets verified via HTTPS.\n'

      - name: Verify LIVE membership discounts and knowledge-powered chat on both domains
        shell: bash
        run: |
          set -euo pipefail
          host="https://hyramgolf.kr"
          for attempt in $(seq 1 20); do
            echo "Live release attempt $attempt/20"
            tmpdir="$(mktemp -d)"
            ok=1
            for item in "index.html" "faq.html" "policies.html" "catalog.html" "chat-widget.js" "chat-knowledge.json"; do
              curl --location --fail --silent --show-error --max-time 20 --retry 1 "$host/$item?release=${GITHUB_SHA}" -o "$tmpdir/$item" || ok=0
            done
            if [[ "$ok" == 1 ]] &&
              grep -Fq '고객에게 더 유리한 한 가지 할인만 적용' "$tmpdir/index.html" &&
              grep -Fq '중복 할인은 불가합니다' "$tmpdir/faq.html" &&
              grep -Fq '20% 할인과 등급별 회원 할인' "$tmpdir/policies.html" &&
              grep -Fq '중복·연속 할인하지 않습니다' "$tmpdir/catalog.html" &&
              grep -Fq 'chat-knowledge.json' "$tmpdir/chat-widget.js" &&
              grep -Fq '"id": "membershipdiscount"' "$tmpdir/chat-knowledge.json"; then
              echo 'PASS: live bare-domain HTTPS renders the new membership rules, FAQ and knowledge base.'
              rm -rf "$tmpdir"
              break
            fi
            rm -rf "$tmpdir"
            if [[ "$attempt" == 20 ]]; then
              echo '::error::Live domain content did not match the validated release.'
              exit 1
            fi
            sleep 10
          done
          wwwstatus="$(curl --location --silent --show-error --max-time 25 --output /tmp/hyram-www-public.html --write-out '%{http_code} %{ssl_verify_result}' "https://www.hyramgolf.kr/?release=${GITHUB_SHA}" || true)"
          if [[ "$wwwstatus" != "200 0" ]]; then
            echo "::error::www domain HTTPS check did not pass: $wwwstatus"
            exit 1
          fi
          grep -Fq 'id="expert-hero-title"' /tmp/hyram-www-public.html
          grep -Fq '고객에게 더 유리한 한 가지 할인만 적용' /tmp/hyram-www-public.html
          echo 'PASS: www HTTPS, release homepage and customer discount policy verified.'
