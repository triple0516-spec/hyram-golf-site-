name: HYRAM Website Concierge and Shop QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'catalog.html'
      - 'shop.html'
      - 'policies.html'
      - 'faq.html'
      - 'chat-widget.js'
      - 'pricing/**'
      - 'chat-widget.css'
      - 'qa/**'
      - 'lesson.html'
      - 'lesson.css'
      - 'expert-home.css'
      - 'images/**'
      - '.github/workflows/site-ui-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check chat-widget.js
      - name: Discount policy unit tests
        run: node --test qa/test_discount_policy.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve site locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hyram-site.log 2>&1 &
          curl -f --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/
      - name: Mobile and desktop Shop + concierge tests
        run: node qa/test_site_browser.cjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyram-site-concierge-shop-screenshots
          path: qa/screenshots/
          if-no-files-found: ignore
