name: GPT and identity backend checks
on:
  pull_request:
    paths:
      - 'backend/worker/**'
      - 'verify.js'
      - 'verify.html'
      - 'signup.html'
      - 'login.html'
      - 'runtime-config.js'
      - 'member.css'
      - 'chat-widget.js'
      - '.github/workflows/backend-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and JSON config syntax
        run: |
          node --check backend/worker/src/index.mjs
          node --check backend/worker/scripts/prepare-deployment.mjs
          node --check chat-widget.js
          node --check verify.js
          node --check runtime-config.js
          node --input-type=module -e "const fs=await import('node:fs'); JSON.parse(fs.readFileSync('backend/worker/wrangler.jsonc','utf8'))"
      - name: API privacy, origin, identity, GPT and deployment preparation tests
        run: node --test backend/worker/test/*.test.mjs
